<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Echos - Contact</title>
    <meta name="description" content="Music for the viola da gamba">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
<header>
    <div class="header-content">
        <p><a href="../media/">Les Echos</a></p>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <ul id="site-nav">
                <li><a href="../media/">MEDIA</a></li>
                <li><a href="../about/">ABOUT</a></li>
                <li><a href="../contact/">CONTACT</a></li>
            </ul>
        </nav>
    </div>
</header>
<main>
    <div class="contact-content">
        <form id="contact-form">
            <input type="hidden" name="access_key" value="061ca041-07e9-438d-af1f-0b80d8b38d9c">
            <input type="checkbox" name="botcheck" style="display: none;">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" maxlength="500" required></textarea>

            <button type="submit">Send Message</button>
            <p id="contact-status"></p>
        </form>
    </div>
</main>
<script src="../assets/js/contact.js"></script>
<script src="../assets/js/nav.js"></script>
<footer>
    <p>&copy; 2026 Les Echos</p>
</footer>
</body>
</html>
